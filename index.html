<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CinéTrack</title>
        <link rel="icon" href="img/cinema.png">
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="JS files/api.js"></script>
    </head>

    <body class="bg-gray-950 text-white">
        <header class="flex bg-gray-900 p-6">
            <div class="bg-red-600  p-2 rounded-full material-icons"></div>
            <h1 class="w-60 text-3xl hover:bg-red-600 font-bold ">CinéTrack</h1>
            <img src="img/loup.png" alt="image-loup">
            <input type="text" placeholder="Rechercher un film..."
                class="w-full p-3 rounded-lg bg-gray-800 outline-none focus:ring-2 focus:ring-red-500">
            <select name="filtre" id="filtre" bg-gray-950>
                <option>tous</option>
                <option>Serie</option>
                <option>movoe</option>
            </select>
        </header>

        <main class="flex flex-col md:flex-row gap-5 p-5">
            <section id="card" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 flex-1">
                <!-- Movie 1 -->
                <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
                    <img src="images/inception.jpg" alt="Inception" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-bold">Inception</h3>
                        <p class="text-gray-400 text-sm mt-2">Science-fiction · 2010</p>
                        <p class="text-yellow-400 mt-2">⭐ 8.8/10</p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg mt-4 w-full">
                            ❤️ Ajouter aux favoris
                        </button>
                    </div>
                </article>

                <!-- Movie 2 -->
                <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
                    <img src="images/interstellar.jpg" alt="Interstellar" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-bold">Interstellar</h3>
                        <p class="text-gray-400 text-sm mt-2">Science-fiction · 2014</p>
                        <p class="text-yellow-400 mt-2">⭐ 8.7/10</p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg mt-4 w-full">
                            ❤️ Ajouter aux favoris
                        </button>
                    </div>
                </article>

                <!-- Movie 3 -->
                <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
                    <img src="images/joker.jpg" alt="Joker" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-bold">Joker</h3>
                        <p class="text-gray-400 text-sm mt-2">Drame · 2019</p>
                        <p class="text-yellow-400 mt-2">⭐ 8.4/10</p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg mt-4 w-full">
                            ❤️ Ajouter aux favoris
                        </button>
                    </div>
                </article>

                <!-- Movie 4 -->
                <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
                    <img src="images/avatar.jpg" alt="Avatar" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-bold">Avatar</h3>
                        <p class="text-gray-400 text-sm mt-2">Aventure · 2009</p>
                        <p class="text-yellow-400 mt-2">⭐ 7.9/10</p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg mt-4 w-full">
                            ❤️ Ajouter aux favoris
                        </button>
                    </div>
                </article>

                <!-- Movie 5 -->
                <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
                    <img src="images/titanic.jpg" alt="Titanic" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-bold">Titanic</h3>
                        <p class="text-gray-400 text-sm mt-2">Romance · 1997</p>
                        <p class="text-yellow-400 mt-2">⭐ 7.9/10</p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg mt-4 w-full">
                            ❤️ Ajouter aux favoris
                        </button>
                    </div>
                </article>

                <!-- Movie 6 -->
                <article class="bg-gray-800 rounded-xl overflow-hidden shadow-lg">
                    <img src="images/avengers.jpg" alt="Avengers" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="text-xl font-bold">Avengers</h3>
                        <p class="text-gray-400 text-sm mt-2">Action · 2012</p>
                        <p class="text-yellow-400 mt-2">⭐ 8.0/10</p>
                        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg mt-4 w-full">
                            ❤️ Ajouter aux favoris
                        </button>
                    </div>
                </article>

            </section>
            <aside class="w-64 bg-gray-800 text-white p-4 rounded-xl">
                <h2 class="text-xl font-bold mb-4">❤️ Favorites</h2>

                <div id="favorites">
                    Aucun favori pour le moment.
                </div>
            </aside>

        </main>
